# ============================================================
# Quarkus HTTP
# ============================================================
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Accept,Content-Type,Origin
quarkus.http.cors.access-control-max-age=24H

# ============================================================
# Logging
# ============================================================
quarkus.log.level=INFO
quarkus.log.category."com.bi.exam".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n

# ============================================================
# OpenAPI / Swagger
# ============================================================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ============================================================
# SSAS connection (via ADOMD.NET PowerShell bridge — no IIS needed)
# ============================================================
ssas.data-source=localhost
ssas.catalog=ExamMultidimensionnel
ssas.cube=VDS
